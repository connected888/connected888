<ngx-spinner [fullScreen]="true" bdColor="rgba(10, 8, 20, 0.75)">
  <div class="healing-loader breathing-mandala">
    <!-- simple mandala-like SVG -->
    <svg viewBox="0 0 120 120" class="mandala">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%">
          <stop offset="0%" stop-color="var(--energy-accent)" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- glow -->
      <circle cx="60" cy="60" r="52" fill="url(#glow)"></circle>
      <!-- petals -->
      <g class="petals">
        <circle r="18" cx="60" cy="28"></circle>
        <circle r="18" cx="92" cy="60"></circle>
        <circle r="18" cx="60" cy="92"></circle>
        <circle r="18" cx="28" cy="60"></circle>
        <circle r="18" cx="85" cy="35"></circle>
        <circle r="18" cx="85" cy="85"></circle>
        <circle r="18" cx="35" cy="85"></circle>
        <circle r="18" cx="35" cy="35"></circle>
      </g>
      <circle cx="60" cy="60" r="8" class="core"></circle>
    </svg>
    <p class="loader-text">balancing your energy…</p>
  </div>
</ngx-spinner>
<ng-container *ngIf="!hideLayout">
  <app-header></app-header>
</ng-container>
<router-outlet></router-outlet>

<ng-container >
  <app-footer></app-footer>
</ng-container>
