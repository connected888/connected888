<section class="promoter-section">
  <div class="promoter-wrapper">

    <!-- LEFT CONTENT -->
    <div class="promoter-left">

      <h1 class="title">Become a Promoter</h1>
      <p class="subtitle">Join our community and promote events</p>

      <h3 class="block-title">What You’ll Do</h3>
      <ul class="tasks">
        <li>Share event information with your network</li>
        <li>Post about events on social media</li>
        <li>Get your audience excited about events</li>
      </ul>

      <h2 class="form-title">Sign up to become a promoter</h2>

      <form class="promoter-form">
        <div class="row " style="margin-left: 1px;">
          <input type="text" placeholder="First Name">
          <input type="text" placeholder="Last Name">
        </div>

        <input type="text" placeholder="Organization Name">
        <input type="email" placeholder="Email Address">
        <select>
          <option>Select country</option>
        </select>

        <button type="submit">Submit</button>
      </form>

    </div>

    <!-- RIGHT IMAGE -->
    <div class="promoter-right">
      <img src="/images/promote/promote.jpg" alt="Promoter">
    </div>

  </div>
</section>
