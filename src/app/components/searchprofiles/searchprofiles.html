<section class="sp-wrap py-4 py-lg-5">
  <div class="container">

    <h1 class="display-6 fw-semibold mb-4">Search Listings</h1>

    <!-- Filters -->
    <form [formGroup]="form" class="sp-filters card p-3 p-lg-4 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-4">
          <label class="form-label">Search by Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input class="form-control" formControlName="q" placeholder="Search by name or bio…" />
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <label class="form-label">Services <small class="text-muted">(Select All that Apply)</small></label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="text-truncate">
                {{ (form.value.services?.length || 0) ? (form.value.services?.join(', ')) : 'Nothing selected' }}
              </span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu w-100 p-2 sp-service-menu">
              <li *ngFor="let s of allServices">
                <button class="btn btn-sm me-2 mb-2" [class.btn-primary]="form.value.services?.includes(s)"
                        [class.btn-outline-secondary]="!form.value.services?.includes(s)"
                        (click)="toggleService(s, $event)">{{ s }}</button>
              </li>
            </ul>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label">Country</label>
          <select class="form-select" formControlName="country">
            <option value="">Select Country…</option>
            <option *ngFor="let c of allCountries" [value]="c">{{ c }}</option>
          </select>
        </div>

        <div class="col-6 col-lg-1">
          <label class="form-label">Per Page</label>
          <select class="form-select" formControlName="perPage" (change)="setPage(1)">
            <option>6</option>
            <option selected>12</option>
            <option>18</option>
            <option>24</option>
          </select>
        </div>

        <div class="col-6 col-lg-12 col-xl-1 text-lg-end">
          <button type="button" class="btn btn-warning w-100 w-lg-auto mt-2 mt-lg-0" (click)="clearAll()">Clear All</button>
        </div>
      </div>
    </form>

    <!-- Results summary -->
    <ng-container *ngIf="(vm$ | async) as vm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted small">
          Showing <strong>{{ vm.startIndex }}</strong>–<strong>{{ vm.endIndex }}</strong> of
          <strong>{{ vm.total }}</strong> results
        </div>

        <!-- Pagination -->
        <nav *ngIf="vm.pages > 1" aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="vm.page === 1">
              <button class="page-link" (click)="setPage(vm.page - 1)">Prev</button>
            </li>
            <li class="page-item" *ngFor="let p of [].constructor(vm.pages); let i = index"
                [class.active]="i + 1 === vm.page">
              <button class="page-link" (click)="setPage(i + 1)">{{ i + 1 }}</button>
            </li>
            <li class="page-item" [class.disabled]="vm.page === vm.pages">
              <button class="page-link" (click)="setPage(vm.page + 1)">Next</button>
            </li>
          </ul>
        </nav>
      </div>

      <!-- Skeleton while loading -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" *ngIf="(loading$ | async)">
        <div class="col" *ngFor="let s of [1,2,3,4,5,6]">
          <div class="sp-card card h-100">
            <div class="sp-card-img skeleton"></div>
            <div class="card-body">
              <div class="skeleton w-50 mb-2"></div>
              <div class="skeleton w-75 mb-2"></div>
              <div class="skeleton w-25"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Cards -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" *ngIf="!(loading$ | async)">
        <div class="col" *ngFor="let p of vm.rows; trackBy: trackById">
          <article class="sp-card card h-100">
            <div class="sp-card-img">
              <img [src]="p.avatar || '/images/mn.jpg'" alt="{{p.name}} avatar" />
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <h3 class="h6 fw-semibold mb-2 text-truncate">{{ p.name }}</h3>
                <span class="badge bg-light text-dark border">{{ p.country }}</span>
              </div>

              <p class="text-muted small mb-2 text-truncate-2">{{ p.bio || '—' }}</p>

              <div class="mb-2">
                <span *ngFor="let s of p.services" class="badge bg-primary-subtle text-primary me-1 mb-1">{{ s }}</span>
              </div>

              <ul class="list-unstyled small text-muted mb-3 sp-contact">
                <li *ngIf="p.website"><i class="bi bi-globe2 me-2"></i><a [href]="p.website" target="_blank">{{ p.website }}</a></li>
                <li *ngIf="p.email"><i class="bi bi-envelope me-2"></i><a [href]="'mailto:'+p.email">{{ p.email }}</a></li>
                <li *ngIf="p.phone"><i class="bi bi-telephone me-2"></i><a [href]="'tel:'+p.phone">{{ p.phone }}</a></li>
              </ul>

              <div class="d-flex justify-content-between align-items-center">
                <a class="btn btn-outline-secondary btn-sm" (click)="fullListing()">Full Listing</a>
                
              </div>
            </div>
          </article>
        </div>
      </div>

      <!-- Empty state -->
      <div class="text-center text-muted py-5" *ngIf="!vm.total && !(loading$ | async)">
        <i class="bi bi-search display-6 d-block mb-2"></i>
        No profiles match your filters. Try clearing filters.
      </div>
    </ng-container>
  </div>
</section>
