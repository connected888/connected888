<section class="sp-wrap py-4 py-lg-5">
  <div class="container">
    <h4 class="display-7 fw-semibold mb-4">Search Profiles</h4>

    <!-- Filters -->
    <form [formGroup]="form" class="sp-filters card p-3 p-lg-4 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-4">
          <label class="form-label">Search by Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input class="form-control" formControlName="q" placeholder="Search by name or bio…" />
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label">Services</label>
          <div class="dropdown w-100">
            <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="text-truncate">
                {{ (form.value.services?.length || 0) ? (form.value.services?.join(', ')) : 'Nothing selected' }}
              </span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu w-100 p-2 sp-service-menu">
              <li *ngFor="let s of allServices">
                <button class="btn btn-sm me-2 mb-2" [class.btn-primary]="form.value.services?.includes(s)"
                        [class.btn-outline-secondary]="!form.value.services?.includes(s)"
                        (click)="toggleService(s, $event)">{{ s }}</button>
              </li>
            </ul>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <label class="form-label">Country</label>
          <select class="form-select" formControlName="country">
            <option value="">Select Country…</option>
            <option *ngFor="let c of allCountries" [value]="c">{{ c }}</option>
          </select>
        </div>

        <div class="col-6 col-lg-1">
          <label class="form-label">Per Page</label>
          <select class="form-select" formControlName="perPage" (change)="setPage(1)">
            <option>6</option>
            <option>12</option>
            <option>18</option>
            <option>24</option>
          </select>
        </div>

        <div class="col-6 col-lg-12 col-xl-1 text-lg-end">
          <button type="button" class="btn btn-warning w-100 w-lg-auto mt-2 mt-lg-0" (click)="clearAll()">Clear All</button>
        </div>
      </div>
    </form>

    <!-- Results -->
    <ng-container *ngIf="(vm$ | async) as vm">

      <!-- Summary + Pagination -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted small">
          Showing <strong>{{ vm.startIndex }}</strong>–<strong>{{ vm.endIndex }}</strong> of
          <strong>{{ vm.total }}</strong> results
        </div>
      </div>

      <!-- Practitioner Cards -->
<!-- Practitioner Cards -->
<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 gx-3 gy-4 m-0" *ngIf="!(loading$ | async)">
  <div class="col" *ngFor="let p of vm.rows; trackBy: trackById">
    <article class="sp-card practitioner-card text-center mx-auto">
      <div class="ribbon">{{ p.ribbon || 'Practitioner' }}</div>

      <div
        class="cover"
        [style.background-color]="p.coverColor || '#9999CC'"
        [style.background-image]="p.coverImage ? 'url(' + p.coverImage + ')' : 'none'">
      </div>

      <img [src]="p.avatar || '/images/default-user.png'" alt="{{p.name}}" class="profile-pic" />

      <h3 class="name">{{ p.name }}</h3>

      <div class="tags" *ngIf="p.services?.length">
        <span *ngFor="let s of p.services" class="tag">{{ s }}</span>
      </div>

      <div class="country" *ngIf="p.country">
        <small class="text-muted">{{ p.country }}</small>
      </div>

      <p class="description">{{ p.bio || 'No description available.' }}</p>

      <button class="btn" (click)="fullListing()">View Profile</button>
    </article>
  </div>
</div>



      <!-- Empty -->
      <div class="text-center text-muted py-5" *ngIf="!vm.total && !(loading$ | async)">
        <i class="bi bi-search display-6 d-block mb-2"></i>
        No profiles match your filters. Try clearing filters.
      </div>

    </ng-container>
  </div>
</section>
