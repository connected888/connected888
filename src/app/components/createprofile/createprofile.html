<section class="profile-form">
  <h2>Create Profile</h2>

  <div class="stepper-bar">
    <div class="step" [class.active]="step >= 1">
      <span>01</span>
    </div>

    <div class="line" [class.active]="step > 1"></div>

    <div class="step" [class.active]="step >= 2">
      <span>02</span>
    </div>

    <div class="line" [class.active]="step > 2"></div>

    <div class="step" [class.active]="step >= 3">
      <span>03</span>
    </div>
  </div>

  <!-- STEPPER -->
  <div class="stepper">
    <span [class.active]="step >= 1">Personal Info</span>
    <span [class.active]="step >= 2">Contact</span>
    <span [class.active]="step >= 3">Services</span>
  </div>

  <form [formGroup]="form">
    <!-- STEP 1 -->
    <div *ngIf="step === 1">
      <div class="upload-avatar">
        <div class="avatar-circle">👤</div>
        <label class="upload-btn">
          Upload Profile Photo
          <input
            type="file"
            hidden
            (change)="onFileSelect($event, 'profilePhoto')"
          />
        </label>
      </div>

      <div class="row">
        <div class="col">
          <input formControlName="firstName" placeholder="First Name *" />
        </div>

        <div class="col">
          <input formControlName="lastName" placeholder="Last Name *" />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <select formControlName="country">
            <option value="">Select country</option>
          </select>
        </div>
        <div class="col">
          <select formControlName="language">
            <option value="">Select language</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col">
        <select formControlName="modality">
          <option value="">Select modality</option>
        </select>
        </div>
        <div class="col">
           <input formControlName="email" placeholder="Contact Email" />
        </div>

        
      </div>
      <div class="row">
        <div class="col">
      <textarea
        formControlName="headline"
        placeholder="Organization Name / Headline"
      ></textarea>
        </div>


      </div>

      <div class="row">
        <div class="col">
      <textarea
        formControlName="statement"
        placeholder="Profile Statement"
      ></textarea>
        </div>

      </div>


      <div class="upload-bg">
        <label class="bg-box">
          Upload Background Image
          <input
            type="file"
            hidden
            (change)="onFileSelect($event, 'backgroundImage')"
          />
        </label>
      </div>
    </div>

<!-- STEP 2 -->
<div *ngIf="step === 2" class="step-section">

  <!-- Row: Email + Phone -->
  <div class="row">
    <div class="field">
      <label>Contact Email</label>
      <input formControlName="contactEmail" placeholder="Example@gmail.com">
    </div>

    <div class="field">
      <label>Phone Number</label>
      <input formControlName="phone" placeholder="+1 ( ) -">
    </div>
  </div>

  <!-- Website -->
  <div class="field full mt-40">
    <label>Website</label>
    <input formControlName="website" placeholder="Website">
  </div>

  <!-- Social Links -->
  <div class="mt-40">
    <label class="section-label">Social Links</label>

    <div class="row">
      <div class="field">
        <input formControlName="youtube" placeholder="Youtube">
      </div>
      <div class="field">
        <input formControlName="facebook" placeholder="Facebook">
      </div>
    </div>

    <div class="row mt-24">
      <div class="field">
        <input formControlName="linkedin" placeholder="LinkedIn">
      </div>
      <div class="field">
        <input formControlName="instagram" placeholder="Instagram">
      </div>
    </div>

    <div class="row mt-24">
      <div class="field">
        <input formControlName="meetup" placeholder="Meetup">
      </div>
      <div class="field">
        <input formControlName="tiktok" placeholder="TikTok">
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="field full mt-40">
    <label>Footer Statement *</label>
    <input formControlName="footerStatement" placeholder="Please enter the name of your Country">
  </div>

</div>

<!-- STEP 3 -->
<div *ngIf="step === 3" class="services-step">

  <div formArrayName="services">

    <div class="service-card" *ngFor="let s of services.controls; let i = index" [formGroupName]="i">

      <div class="service-header">Service {{ i + 1 }}</div>

      <div class="service-grid">

        <!-- LEFT -->
        <div class="service-fields">

          <label>Service Name</label>
          <input formControlName="name" placeholder="e.g. Reiki Healing">

          <label>Service Description</label>
          <textarea formControlName="description" placeholder="e.g. A soothing session to calm mind and restore balance and healing"></textarea>

          <div class="row">
            <div>
              <label>Start Date</label>
              <input type="date" formControlName="startDate">
            </div>
            <div>
              <label>End Date</label>
              <input type="date" formControlName="endDate">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Start Time</label>
              <input type="time" formControlName="startTime">
            </div>
            <div>
              <label>End Time</label>
              <input type="time" formControlName="endTime">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Price</label>
              <input formControlName="price" placeholder="$">
            </div>
            <div>
              <label>Schedule URL</label>
              <input formControlName="scheduleUrl" placeholder="Please enter your scheduling link">
            </div>
          </div>

        </div>

        <!-- RIGHT IMAGE -->
        <div class="service-image">
          <label class="upload-box">
            Upload Photo
            <input type="file" hidden (change)="onServiceImageSelect($event, i)">
          </label>
        </div>

      </div>

    </div>

  </div>

  <button type="button" class="add-btn" (click)="addService()">+ Add New Service</button>

</div>


    <!-- ACTIONS -->
    <div class="actions">
      <button type="button" (click)="back()" *ngIf="step > 1">Back</button>
      <button type="button" (click)="next()" *ngIf="step < totalSteps">
        Next
      </button>
      <button type="submit" (click)="submit()" *ngIf="step === totalSteps">
        Submit
      </button>
    </div>
  </form>
</section>
